[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vahini"
version = "0.2.0"
description = "An AI-powered SOC that cannot be manipulated: zero trust and defense in depth for the AI itself."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Team Zenith" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
llm = ["anthropic>=0.121"]
# Layer-2 classifier (Llama Prompt Guard 2).
ml = ["transformers>=4.44", "torch>=2.3"]

[project.scripts]
vahini = "vahini.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prahari"
version = "0.1.0"
description = "Agentic SOC copilot that cannot be talked out of an alert: provenance-enforced, privacy-preserving, conformally gated."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vishnu Kosuri" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Layer-2 classifier (Llama Prompt Guard 2) and LLM planner backends.
ml = ["transformers>=4.44", "torch>=2.3"]
llm = ["anthropic>=0.40", "openai>=1.50"]

[project.scripts]
prahari-demo = "prahari.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-label="Policy engine: five ordered deterministic checks; exfiltration is denied first, read-only tools run, and crown jewels, tainted arguments or high risk go to a human."><defs><marker id="policy-ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#1F2933"/></marker><marker id="policy-ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#5F6B76"/></marker><marker id="policy-ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#2B4C7E"/></marker><marker id="policy-ah-trust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#2F6F5E"/></marker><marker id="policy-ah-untrust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#B5502F"/></marker></defs><rect width="1200" height="330" style="fill:#FBFAF7"/><rect x="20" y="50" width="176" height="104" rx="10" style="fill:#FFFFFF;stroke:#CBD2D9;stroke-width:1.5"/><text x="34" y="74" text-anchor="start" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:11px;font-weight:600">RULE 1</text><text x="34" y="96" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600">Egress payload</text><text x="34" y="114" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">not readable by</text><text x="34" y="132" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">recipient?</text><path d="M108,154 L108,214" style="fill:none;stroke:#B5502F;stroke-width:1.6" marker-end="url(#policy-ah-untrust)"/><text x="116" y="190" text-anchor="start" style="fill:#B5502F;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">yes</text><rect x="48" y="216" width="120" height="34" rx="17.0" style="fill:#F8E7E0;stroke:#B5502F;stroke-width:2"/><text x="108.0" y="238.0" text-anchor="middle" style="fill:#B5502F;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:13px;font-weight:600">DENY</text><path d="M196,102 L224,102" style="fill:none;stroke:#5F6B76;stroke-width:1.6" marker-end="url(#policy-ah-muted)"/><text x="210" y="94" text-anchor="middle" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">no</text><rect x="226" y="50" width="176" height="104" rx="10" style="fill:#FFFFFF;stroke:#CBD2D9;stroke-width:1.5"/><text x="240" y="74" text-anchor="start" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:11px;font-weight:600">RULE 2</text><text x="240" y="96" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600">Read-only</text><text x="240" y="114" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">tool?</text><path d="M314,154 L314,214" style="fill:none;stroke:#2F6F5E;stroke-width:1.6" marker-end="url(#policy-ah-trust)"/><text x="322" y="190" text-anchor="start" style="fill:#2F6F5E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">yes</text><rect x="254" y="216" width="120" height="34" rx="17.0" style="fill:#E3F0EA;stroke:#2F6F5E;stroke-width:2"/><text x="314.0" y="238.0" text-anchor="middle" style="fill:#2F6F5E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:13px;font-weight:600">ALLOW</text><path d="M402,102 L430,102" style="fill:none;stroke:#5F6B76;stroke-width:1.6" marker-end="url(#policy-ah-muted)"/><text x="416" y="94" text-anchor="middle" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">no</text><rect x="432" y="50" width="176" height="104" rx="10" style="fill:#FFFFFF;stroke:#CBD2D9;stroke-width:1.5"/><text x="446" y="74" text-anchor="start" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:11px;font-weight:600">RULE 3</text><text x="446" y="96" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600">Touches a</text><text x="446" y="114" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">crown-jewel asset?</text><path d="M520,154 L520,214" style="fill:none;stroke:#2B4C7E;stroke-width:1.6" marker-end="url(#policy-ah-accent)"/><text x="528" y="190" text-anchor="start" style="fill:#2B4C7E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">yes</text><rect x="460" y="216" width="120" height="34" rx="17.0" style="fill:#E6EDF6;stroke:#2B4C7E;stroke-width:2"/><text x="520.0" y="238.0" text-anchor="middle" style="fill:#2B4C7E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:13px;font-weight:600">APPROVE</text><path d="M608,102 L636,102" style="fill:none;stroke:#5F6B76;stroke-width:1.6" marker-end="url(#policy-ah-muted)"/><text x="622" y="94" text-anchor="middle" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">no</text><rect x="638" y="50" width="176" height="104" rx="10" style="fill:#FFFFFF;stroke:#CBD2D9;stroke-width:1.5"/><text x="652" y="74" text-anchor="start" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:11px;font-weight:600">RULE 4</text><text x="652" y="96" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600">Any argument</text><text x="652" y="114" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">from an untrusted</text><text x="652" y="132" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">source?</text><path d="M726,154 L726,214" style="fill:none;stroke:#2B4C7E;stroke-width:1.6" marker-end="url(#policy-ah-accent)"/><text x="734" y="190" text-anchor="start" style="fill:#2B4C7E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">yes</text><rect x="666" y="216" width="120" height="34" rx="17.0" style="fill:#E6EDF6;stroke:#2B4C7E;stroke-width:2"/><text x="726.0" y="238.0" text-anchor="middle" style="fill:#2B4C7E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:13px;font-weight:600">APPROVE</text><path d="M814,102 L842,102" style="fill:none;stroke:#5F6B76;stroke-width:1.6" marker-end="url(#policy-ah-muted)"/><text x="828" y="94" text-anchor="middle" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">no</text><rect x="844" y="50" width="176" height="104" rx="10" style="fill:#FFFFFF;stroke:#CBD2D9;stroke-width:1.5"/><text x="858" y="74" text-anchor="start" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:11px;font-weight:600">RULE 5</text><text x="858" y="96" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600">Risk above</text><text x="858" y="114" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">autonomous</text><text x="858" y="132" text-anchor="start" style="fill:#1F2933;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">ceiling?</text><path d="M932,154 L932,214" style="fill:none;stroke:#2B4C7E;stroke-width:1.6" marker-end="url(#policy-ah-accent)"/><text x="940" y="190" text-anchor="start" style="fill:#2B4C7E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">yes</text><rect x="872" y="216" width="120" height="34" rx="17.0" style="fill:#E6EDF6;stroke:#2B4C7E;stroke-width:2"/><text x="932.0" y="238.0" text-anchor="middle" style="fill:#2B4C7E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:13px;font-weight:600">APPROVE</text><path d="M1020,102 L1048,102" style="fill:none;stroke:#5F6B76;stroke-width:1.6" marker-end="url(#policy-ah-muted)"/><text x="1034" y="94" text-anchor="middle" style="fill:#5F6B76;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:12px;font-weight:400">no</text><rect x="1050" y="85" width="120" height="34" rx="17.0" style="fill:#E3F0EA;stroke:#2F6F5E;stroke-width:2"/><text x="1110.0" y="107.0" text-anchor="middle" style="fill:#2F6F5E;font-family:Geist Mono, Consolas, Menlo, monospace;font-size:13px;font-weight:600">ALLOW</text><text x="638" y="280" text-anchor="middle" style="fill:#2B4C7E;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:12px;font-weight:600">Meta’s Rule of Two, in code</text><text x="20" y="316" text-anchor="start" style="fill:#5F6B76;font-family:Geist, Segoe UI, Helvetica, Arial, sans-serif;font-size:13px;font-weight:400">Plain Python, not a prompt: injected text can change what the model proposes, never which rule fires.</text></svg>
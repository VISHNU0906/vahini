<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vahini Console</title>
<style>
  :root { --bg:#FBFAF7; --ink:#1F2933; --muted:#5F6B76; --line:#CBD2D9; --navy:#2B4C7E; --brick:#B5502F; --sage:#2F6F5E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  h1 { margin:0; font-size:20px; } h2 { font-size:15px; margin:0 0 10px; color:var(--navy); text-transform:uppercase; letter-spacing:.08em; }
  main { display:grid; grid-template-columns: 1.4fr 1fr; gap:24px; padding:24px; }
  section { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0; }
  .card { border-top:1px solid var(--line); padding:12px 0; }
  .card:first-of-type { border-top:0; }
  .tool { font-weight:600; } .why { color:var(--muted); } code { font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:9px; margin-right:4px; background:#F8E7E0; color:var(--brick); }
  .tag.ok { background:#E3F0EA; color:var(--sage); }
  button { border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:6px; padding:5px 12px; cursor:pointer; margin-right:6px; }
  button.deny { background:#fff; color:var(--navy); }
  button:focus-visible { outline:2px solid var(--brick); outline-offset:2px; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>Vahini · Analyst console</h1><span id="who"></span></header>
<main>
  <section>
    <h2>Waiting for you</h2>
    <div id="approvals">Loading…</div>
  </section>
  <section>
    <h2>Incidents</h2>
    <div id="incidents">Loading…</div>
  </section>
</main>
<script>
const analyst = localStorage.getItem("vahini-analyst") || prompt("Your analyst id") || "analyst";
try { localStorage.setItem("vahini-analyst", analyst); } catch (e) {}
document.getElementById("who").textContent = "signed in as " + analyst;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function refresh() {
  const [apr, inc] = await Promise.all([fetch("/v1/approvals").then(r => r.json()), fetch("/v1/incidents").then(r => r.json())]);
  document.getElementById("approvals").innerHTML = apr.length ? apr.map(p => `
    <div class="card">
      <div class="tool">${esc(p.tool)} <code>${esc(JSON.stringify(p.args))}</code></div>
      <div>${Object.entries(p.provenance).map(([k, v]) => `<span class="tag">${esc(k)} ← ${esc(v.join(", "))}</span>`).join("")}</div>
      <div class="why">${esc(p.reasons.join("; "))} · case ${esc(p.case)}</div>
      <div style="margin-top:8px"><button onclick="decide('${esc(p.id)}','approve')">Approve</button><button class="deny" onclick="decide('${esc(p.id)}','deny')">Deny</button></div>
    </div>`).join("") : "Nothing waiting. Every pending action has been handled.";
  document.getElementById("incidents").innerHTML = inc.length ? inc.map(i => `
    <div class="card"><div class="tool">${esc(i.stages)} stage${i.stages === 1 ? "" : "s"} · ${esc(i.alerts.length)} alerts</div>
    <div>${i.tactics.map(t => `<span class="tag ok">${esc(t)}</span>`).join("")}</div></div>`).join("") : "No incidents yet.";
}

async function decide(id, decision) {
  await fetch("/v1/approvals/" + id, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({decision, analyst})});
  refresh();
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>

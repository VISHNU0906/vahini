# Only the SIEM, the OTel collector and the console may reach Vahini.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-vahini
spec:
  podSelector:
    matchLabels: {app: vahini}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: ["wazuh-manager", "otel-collector", "vahini-console"]}
      ports:
        - port: 8080

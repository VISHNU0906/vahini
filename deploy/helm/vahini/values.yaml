image:
  repository: ghcr.io/vishnu0906/vahini
  tag: "0.3.0"
  pullPolicy: IfNotPresent

replicaCount: 1

tenant: vishnu-org
# The tenant key must come from a secret that lives in the customer's own cluster.
tenantKeySecret:
  name: vahini-tenant-key
  key: key

crownJewels: "SAP-FIN-DB,VISH-DC01"
alpha: "0.01"
beta: "0.05"
dryRun: "true"

anthropicApiKeySecret:
  name: ""          # leave empty to run with a local model only
  key: api-key

service:
  type: ClusterIP
  port: 8080

resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}

persistence:
  enabled: true
  size: 5Gi          # signed ledger database
